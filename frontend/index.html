<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #07111f, #12263d);
        color: #eaf4ff;
        font-family: Arial, sans-serif;
      }

      .card {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 40px 60px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 2.6rem;
        letter-spacing: 0.05em;
      }

      p {
        margin-top: 12px;
        font-size: 1rem;
        color: #b8d8ff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Nexora</h1>
      <p>the secure coding agent</p>
    </div>
  </body>
</html>
